name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:content && npm run data -w @reborn/web
      - run: npm run typecheck
      - run: npm test
      # 한 번도 일어나지 않는 사건이 있으면 실패
      - run: node scripts/content-report.ts 2000 --strict
      - run: npm run build
        env:
          PAGES_BASE: /reborn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
