# 성인기: 일·돈·위험 (18~64세)

- id: adult.license
  kind: happening
  category: life
  when: { age: [18, 30], if: "urban || country.income in ['UMC', 'HIC']" }
  chance:
    base: "country.income == 'HIC' ? 0.25 : 0.08"
    odds:
      - { by: household, beta: 0.3, center: 3 }
  outcomes:
    - effects: { stats: { happiness: 2 }, set: { license: true }, log: ev.adult.license, tags: [milestone] }
  tone: light

- id: adult.own_place
  kind: decision
  category: life
  when: { age: [20, 35], if: "!family.married && job != null" }
  chance: 0.12
  title: dec.place.title
  body: dec.place.body
  options:
    - id: move
      label: dec.place.move
      hint: dec.place.move.hint
      resolve:
        effects: { money: { cash: "-money.income * 0.15" }, stats: { happiness: 4, relations: -1 }, set: { ownPlace: true }, log: dec.place.move.ok, tags: [new_start] }
    - id: stay
      label: dec.place.stay
      resolve:
        effects: { money: { cash: "money.income * 0.05" }, stats: { relations: 2 }, log: dec.place.stay.ok }
  auto:
    move: "money.pct * 100"
    stay: 50

- id: adult.side_business
  kind: decision
  category: work
  when: { age: [25, 55], once: false, cooldown: 12, if: "job != null && money.cash > 0" }
  chance: 0.04
  title: dec.biz.title
  body: dec.biz.body
  options:
    - id: start
      label: dec.biz.start
      hint: dec.biz.start.hint
      resolve:
        effects: { money: { cash: "-money.cash * 0.5" } }
        chance:
          base: 0.35
          odds:
            - { by: stats.knowledge, beta: 0.03, center: 50 }
        success: { money: { pct: 0.12, cash: "money.income * 0.5" }, stats: { happiness: 6 }, log: dec.biz.ok, tags: [achievement, work] }
        fail: { money: { debt: "money.income * 0.4" }, stats: { happiness: -7 }, log: dec.biz.fail, tags: [setback] }
    - id: no
      label: dec.biz.no
      resolve:
        effects: { log: dec.biz.no.ok }
  auto:
    start: "20 + stats.knowledge / 4"
    no: 60

- id: adult.house
  kind: decision
  category: life
  when: { age: [28, 55], if: "family.married && money.home == 0 && money.income > 0 && money.cash + money.deposit >= prices.home * 0.2" }
  chance: 0.12
  title: dec.house.title
  body: dec.house.body
  options:
    - id: buy
      label: dec.house.buy
      hint: dec.house.buy.hint
      resolve:
        effects: { finance: { deposit: "-money.deposit", buyHome: true }, stats: { happiness: 6 }, log: dec.house.buy.ok, tags: [milestone, money] }
    - id: rent
      label: dec.house.rent
      resolve:
        effects: { log: dec.house.rent.ok }
  auto:
    buy: "money.pct * 100"
    rent: 45

- id: adult.work_injury
  kind: happening
  category: health
  when: { age: [16, 64], once: false, cooldown: 8, if: "jobSector == 'industry' || jobSector == 'agri'" }
  chance:
    base: "country.income in ['LIC', 'LMC'] ? 0.025 : 0.012"
  outcomes:
    - weight: 4
      effects: { stats: { health: -8, happiness: -3 }, money: { cash: "-money.income * 0.1" }, log: ev.adult.injury, tags: [illness, setback] }
    - weight: 1
      effects: { stats: { health: -16, happiness: -6 }, call: job.quit, causeHint: { cause: injury, k: 1.2 }, log: ev.adult.injury.big, tags: [illness, loss] }
  tone: heavy

- id: adult.mentor
  kind: happening
  category: work
  when: { age: [20, 40], if: "job != null" }
  chance: 0.05
  outcomes:
    - effects: { stats: { knowledge: 4, happiness: 2 }, money: { pct: 0.03 }, log: ev.adult.mentor, tags: [growth, work] }
  tone: light

- id: adult.burnout
  kind: decision
  category: work
  when: { age: [25, 60], once: false, cooldown: 6, if: "job != null" }
  chance:
    base: 0.03
    odds:
      - { if: "focus == 'work'", x: 3 }
      - { by: stats.health, beta: -0.03, center: 60 }
  title: dec.burnout.title
  body: dec.burnout.body
  options:
    - id: rest
      label: dec.burnout.rest
      resolve:
        effects: { stats: { health: 5, happiness: 4 }, money: { cash: "-money.income * 0.1", pct: -0.02 }, log: dec.burnout.rest.ok, tags: [care] }
    - id: push
      label: dec.burnout.push
      resolve:
        effects: { stats: { health: -6, happiness: -4 }, money: { pct: 0.02 }, log: dec.burnout.push.ok }
  auto:
    rest: "100 - stats.health"
    push: 45

- id: adult.night_school
  kind: decision
  category: education
  when: { age: [20, 45], if: "edu.rank <= 1 && !edu.inSchool && (urban || country.income in ['UMC', 'HIC'])" }
  chance: 0.06
  title: dec.night.title
  body: dec.night.body
  options:
    - id: enroll
      label: dec.night.enroll
      resolve:
        chance:
          base: 0.6
          odds:
            - { by: stats.knowledge, beta: 0.03, center: 40 }
        success: { edu: secondary, stats: { knowledge: 8, happiness: 4 }, money: { pct: 0.05 }, log: dec.night.ok, tags: [achievement] }
        fail: { stats: { knowledge: 3, health: -2 }, log: dec.night.fail }
    - id: skip
      label: dec.night.skip
      resolve:
        effects: { log: dec.night.skip.ok }
  auto:
    enroll: "30 + stats.knowledge / 3"
    skip: 50

- id: adult.volunteer
  kind: happening
  category: social
  when: { age: [18, 80], once: false, cooldown: 10 }
  chance: 0.025
  outcomes:
    - effects: { stats: { relations: 4, happiness: 3 }, log: ev.adult.volunteer, tags: [joy] }
  tone: light

- id: adult.robbed
  kind: happening
  category: life
  # 살인율이 높은 나라일수록 강도·절도도 흔하다고 보고 근사한다
  when: { age: [15, 85], once: false, cooldown: 10, if: "urban" }
  chance: "clamp(country.homicide / 400, 0.002, 0.08)"
  outcomes:
    - effects: { money: { cash: "-money.cash * 0.15" }, stats: { happiness: -5, health: -1 }, log: ev.adult.robbed, tags: [setback] }
  tone: heavy
  source: [unodc.homicide]

- id: adult.crash
  kind: happening
  category: health
  # 교통사고 사망률을 근거로, 살아남은 사고
  when: { age: [16, 80], once: false, cooldown: 10 }
  chance: "clamp(country.roadDeaths / 1500, 0.002, 0.05)"
  outcomes:
    - effects: { stats: { health: -12, happiness: -4 }, money: { cash: "-money.income * country.oopHealth * (owned('insurance') ? 0.3 : 1) * 0.3" }, log: ev.adult.crash, tags: [illness, setback] }
  tone: heavy
  source: [who.road_deaths]

- id: adult.disaster
  kind: happening
  category: life
  when: { age: [0, 95], once: false, cooldown: 15, if: "country.income in ['LIC', 'LMC']" }
  chance: 0.012
  outcomes:
    - effects: { money: { cash: "-money.cash * 0.5" }, stats: { happiness: -8, health: -3 }, log: ev.adult.disaster, tags: [loss] }
  tone: heavy

- id: adult.lottery_ticket
  kind: decision
  category: life
  when: { age: [20, 70], once: false, cooldown: 15, if: "money.income > 0" }
  chance: 0.02
  title: dec.lotto.title
  body: dec.lotto.body
  options:
    - id: buy
      label: dec.lotto.buy
      resolve:
        chance: 0.01
        success: { money: { cash: "money.income * 5" }, stats: { happiness: 8 }, log: dec.lotto.win, tags: [luck] }
        fail: { money: { cash: "-money.income * 0.01" }, log: dec.lotto.lose }
    - id: pass
      label: dec.lotto.pass
      resolve:
        effects: { log: dec.lotto.pass.ok }
  auto:
    buy: 40
    pass: 60
