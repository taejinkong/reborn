# 무작위 사건 (선택 없이 일어남). 사건은 직접 죽이지 않는다 — 사망은 생명표 모델이 정하고,
# 사건은 상태값과 사망 원인 가중치(causeHint)만 바꾼다.

- id: health.child_fever
  kind: happening
  category: health
  when: { age: [0, 5] }
  chance:
    base: "clamp(country.u5mr / 150, 0.03, 0.5)"
    odds:
      - { by: household, beta: -0.3, center: 3 }
  outcomes:
    - weight: 4
      effects: { stats: { health: -5 }, log: ev.child_fever.ok, tags: [illness, recovery] }
    - weight: 1
      effects: { stats: { health: -12 }, causeHint: { cause: infection, k: 1.5 }, log: ev.child_fever.long, tags: [illness] }
  tone: neutral
  source: [unigme.u5mr]

- id: social.best_friend
  kind: happening
  category: social
  when: { age: [6, 15] }
  chance:
    base: 0.12
    odds:
      - { by: stats.relations, beta: 0.03, center: 55 }
  outcomes:
    - effects: { stats: { relations: 6, happiness: 4 }, set: { bestFriend: true }, log: ev.best_friend, tags: [friendship] }
  tone: light

- id: school.prize
  kind: happening
  category: education
  when: { age: [8, 18], if: "edu.inSchool" }
  chance:
    base: 0.05
    odds:
      - { by: stats.knowledge, beta: 0.06, center: 50 }
  outcomes:
    - effects: { stats: { happiness: 5, knowledge: 2 }, log: ev.school_prize, tags: [achievement] }
  tone: light

- id: health.start_smoking
  kind: happening
  category: health
  when: { age: [14, 30], once: false, if: "!habits.smoker && !did('health.quit_smoking')" }
  # 국가 흡연율 기준, 보정으로 15세 이상 흡연율을 맞춘다
  chance: rates.smoke
  outcomes:
    - effects: { habit: { smoker: true }, log: ev.start_smoking, tags: [habit] }
  tone: neutral
  source: [who.tobacco]

- id: health.quit_smoking
  kind: happening
  category: health
  when: { age: [20, 90], if: "habits.smoker" }
  chance:
    base: rates.quitSmoke
    odds:
      - { by: stats.health, beta: -0.03, center: 60 }
  outcomes:
    - effects: { habit: { smoker: false }, stats: { health: 3 }, log: ev.quit_smoking, tags: [habit, recovery] }
  tone: light

- id: health.hypertension
  kind: happening
  category: health
  when: { age: [35, 95], if: "!has('hypertension')" }
  chance:
    base: 0.018
    odds:
      - { by: stats.health, beta: -0.03, center: 60 }
      - { if: "habits.smoker", x: 1.4 }
  outcomes:
    - effects: { condition: { add: hypertension }, causeHint: { cause: cardio, k: 1.6 }, stats: { health: -4 }, log: ev.hypertension, tags: [illness] }
  tone: neutral

- id: health.diabetes
  kind: happening
  category: health
  when: { age: [30, 95], once: false, if: "!has('diabetes')" }
  # 국가 당뇨 유병률 기준, 보정으로 20~79세 유병률을 맞춘다
  chance:
    base: rates.diabetes
    odds:
      - { by: stats.health, beta: -0.03, center: 60 }
  outcomes:
    - effects: { condition: { add: diabetes }, causeHint: { cause: diabetes, k: 3 }, stats: { health: -5 }, log: ev.diabetes, tags: [illness] }
  tone: neutral

- id: work.promotion
  kind: happening
  category: work
  when: { age: [20, 62], once: false, cooldown: 4, if: "job != null" }
  chance:
    base: 0.08
    odds:
      - { by: stats.knowledge, beta: 0.04, center: 55 }
      - { if: "focus == 'work'", x: 2 }
  outcomes:
    - effects: { money: { pct: 0.06 }, stats: { happiness: 5 }, log: ev.promotion, tags: [achievement, work] }
  tone: light

- id: work.layoff
  kind: happening
  category: work
  when: { age: [20, 62], once: false, cooldown: 6, if: "job != null" }
  chance:
    base: 0.025
    odds:
      - { by: stats.knowledge, beta: -0.02, center: 55 }
  outcomes:
    - effects: { call: job.quit, stats: { happiness: -8 }, log: ev.layoff, tags: [setback, work] }
  tone: neutral

- id: life.small_luck
  kind: happening
  category: life
  when: { age: [10, 100], once: false, cooldown: 10 }
  chance: 0.02
  outcomes:
    - effects: { stats: { happiness: 4 }, money: { cash: "max(money.income * 0.1, 50)" }, log: ev.small_luck, tags: [luck] }
  tone: light

- id: family.reunion
  kind: happening
  category: family
  when: { age: [20, 90], once: false, cooldown: 8, if: "family.motherAlive || family.fatherAlive || family.siblings > 0" }
  chance: 0.06
  outcomes:
    - effects: { stats: { relations: 5, happiness: 3 }, log: ev.reunion, tags: [family] }
  tone: light

- id: family.child_marriage
  kind: happening
  category: family
  # 아이가 고르는 일이 아니므로 갈림길이 아닌 사건이다. 국가 조혼율에 보정으로 맞춘다.
  when: { age: [12, 17], if: "sex == 'F' && !family.partner" }
  chance: rates.childUnion
  outcomes:
    - weight: 7
      effects: { family: { partner: true, marry: true }, call: school.leave, stats: { happiness: -6 }, log: ev.child_marriage, tags: [marriage, loss] }
    - weight: 3
      effects: { family: { partner: true, marry: true }, stats: { happiness: -4 }, log: ev.child_marriage.school, tags: [marriage] }
  tone: sensitive
  source: [unicef.child_marriage]

- id: family.divorce
  kind: happening
  category: family
  when: { age: [18, 90], once: false, if: "family.married" }
  chance: rates.divorce
  outcomes:
    - effects: { family: { divorce: true }, set: { divorced: true }, stats: { happiness: -10, relations: -4 }, log: ev.divorce, tags: [loss, family] }
  tone: heavy
  source: [wmd2019.divorced]
