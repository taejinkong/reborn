# 올해의 초점. stats는 한 해 동안 이 초점에 머물렀을 때의 상태값 변화.
- id: grow
  label: focus.grow
  hint: focus.grow.hint
  age: [0, 5]
  stats: { health: 0.5, relations: 1 }

- id: study
  label: focus.study
  hint: focus.study.hint
  age: [6, 90]
  if: "edu.inSchool || age >= 16"
  stats: { knowledge: 4, happiness: -1, relations: -1 }
  auto: "edu.inSchool ? 3 : 0.4"

- id: friends
  label: focus.friends
  hint: focus.friends.hint
  age: [6, 100]
  stats: { relations: 4, happiness: 3, knowledge: -1 }
  auto: "age < 25 ? 2 : 1"

- id: family
  label: focus.family
  hint: focus.family.hint
  age: [6, 100]
  stats: { relations: 3, happiness: 1 }
  auto: "family.children > 0 ? 2.5 : 1"

- id: exercise
  label: focus.exercise
  hint: focus.exercise.hint
  age: [6, 100]
  stats: { health: 3, happiness: 1 }
  auto: 1

- id: hobby
  label: focus.hobby
  hint: focus.hobby.hint
  age: [8, 100]
  stats: { happiness: 4 }
  auto: 0.8

- id: work
  label: focus.work
  hint: focus.work.hint
  age: [12, 100]
  if: "job != null"
  stats: { health: -2, happiness: -1, relations: -2 }
  auto: 2.5

- id: rest
  label: focus.rest
  hint: focus.rest.hint
  age: [40, 110]
  stats: { health: 1.5, happiness: 2, knowledge: -1 }
  auto: "age >= 65 ? 2.5 : 0.5"
