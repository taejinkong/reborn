ev.family.empty_nest: "아이들이 자라 집을 떠났습니다. 집이 갑자기 조용해졌습니다."
ev.family.grandchild: "당신에게 손주가 생겼습니다."
dec.fight.title: "다툼"
dec.fight.body: "작은 일로 시작한 말다툼이 길어지고 있습니다."
dec.fight.talk: "마주 앉아 이야기한다"
dec.fight.silent: "입을 닫는다"
