ev.adult.injury.big: "일터에서 큰 사고가 났습니다. 당신은 몸을 다쳐 그 일을 계속할 수 없게 되었습니다."
ev.adult.mentor: "일터에서 당신을 아껴 주는 선배를 만났습니다. 배운 것이 많았습니다."
dec.burnout.title: "지친 몸"
dec.burnout.body: "아침에 일어나기가 점점 힘듭니다. 일이 몸과 마음을 갉아먹는 것 같습니다."
dec.burnout.rest: "잠시 쉰다"
dec.burnout.push: "버티며 계속한다"
dec.burnout.rest.ok: "당신은 일을 잠시 내려놓고 숨을 골랐습니다."
dec.burnout.push.ok: "당신은 이를 악물고 버텼습니다. 몸이 그 값을 치렀습니다."
dec.night.title: "늦깎이 공부"
dec.night.body: "일을 마치고 다닐 수 있는 야간 학교가 있다고 합니다."
dec.night.enroll: "다녀 본다"
dec.night.skip: "지금은 어렵다"
