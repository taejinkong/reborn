ev.adult.license: "당신은 운전면허를 땄습니다. 혼자 갈 수 있는 곳이 늘었습니다."
dec.place.title: "혼자 살아 볼까"
dec.place.body: "독립해서 살 만한 작은 방을 찾았습니다. 월세가 만만치 않습니다."
