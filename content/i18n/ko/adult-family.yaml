ev.adult.disaster: "큰물이 마을을 덮쳤습니다. 당신은 살림의 많은 것을 잃었습니다."
dec.lotto.title: "복권 한 장"
dec.lotto.body: "가게 앞에서 복권을 팔고 있습니다."
dec.lotto.buy: "한 장 산다"
dec.lotto.pass: "지나친다"
dec.lotto.win: "믿기 어렵게도 복권이 당첨되었습니다."
dec.lotto.lose: "역시 꽝이었습니다."
dec.lotto.pass.ok: "당신은 그냥 지나쳤습니다."
ev.family.child_school: "당신의 아이가 처음으로 학교에 갔습니다."
ev.family.child_sick: "아이가 크게 아파 당신은 며칠 밤을 새웠습니다."
ev.family.anniversary: "결혼한 지 오래된 날, 두 사람은 처음 만났던 이야기를 다시 나눴습니다."
dec.care.title: "늙은 부모"
dec.care.body: "부모님이 혼자 지내기 어려워지셨습니다. 누군가 돌봐야 합니다."
dec.care.home: "내가 모신다"
dec.care.home.hint: "관계는 깊어지지만 몸과 마음이 지칩니다"
dec.care.help: "돌봄 도움을 구한다"
dec.care.help.hint: "비용이 듭니다"
dec.care.home.ok: "당신은 부모님을 곁에서 모셨습니다. 고단했지만 나눈 이야기가 많았습니다."
