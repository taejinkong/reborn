dec.place.stay.ok: "당신은 가족과 함께 지내며 돈을 모으기로 했습니다."
dec.biz.title: "내 일을 해 볼까"
dec.biz.body: "작은 장사를 함께 해 보자는 제안을 받았습니다. 모아 둔 돈의 절반이 듭니다."
dec.biz.start: "시작한다"
dec.biz.start.hint: "잘되면 벌이가 크게 늘고, 안되면 빚이 생깁니다"
