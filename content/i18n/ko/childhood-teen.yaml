ev.child.hunger: "먹을 것이 넉넉하지 않은 해였습니다. 당신은 또래보다 작고 자주 아팠습니다."
ev.child.injury.small: "당신은 뛰어놀다 넘어져 무릎을 크게 다쳤습니다. 흉터가 남았습니다."
ev.child.injury.big: "당신은 높은 곳에서 떨어져 한동안 걷지 못했습니다."
ev.child.pet: "집에 작은 동물이 들어왔습니다. 당신은 날마다 먹이를 챙겼습니다."
ev.child.grandparent: "할머니는 당신을 무릎에 앉히고 옛날이야기를 들려주곤 했습니다."
ev.child.talent.art: "당신이 그린 그림을 보고 어른들이 오래 들여다보았습니다."
ev.child.talent.sport: "당신은 또래 누구보다 빨리 달렸습니다."
ev.child.talent.music: "당신은 한 번 들은 노래를 금세 따라 불렀습니다."
ev.child.bullied: "학교에서 몇몇 아이들이 당신을 따돌렸습니다. 학교 가는 길이 길게 느껴졌습니다."
ev.child.labor.left: "집안 살림을 돕기 위해 당신은 학교 대신 일터로 나가야 했습니다."
ev.child.labor.after: "당신은 학교가 끝나면 밭과 집안일을 도왔습니다. 숙제할 시간은 늘 모자랐습니다."
ev.child.drought: "비가 오지 않은 해였습니다. 곡식이 말라 가족 모두 끼니를 줄였습니다."
ev.child.moved: "가족이 다른 동네로 이사했습니다. 당신은 친구들과 헤어졌습니다."
ev.child.library: "당신은 학교 도서관에서 책 읽는 재미를 알게 되었습니다."
dec.teen.love.title: "첫 마음"
dec.teen.love.body: "같은 반의 한 사람이 자꾸 눈에 들어옵니다."
dec.teen.love.tell: "마음을 전한다"
dec.teen.love.keep: "혼자 간직한다"
dec.teen.love.yes: "그 사람도 같은 마음이었습니다. 짧았지만 오래 기억에 남을 시간이었습니다."
dec.teen.love.no: "그 사람은 고개를 저었습니다. 당신은 며칠 동안 말이 없었습니다."
dec.teen.love.kept: "당신은 그 마음을 아무에게도 말하지 않았습니다."
dec.teen.exam.title: "시험을 앞두고"
dec.teen.exam.body: "진학 시험이 다가옵니다. 주변에서는 밤늦게까지 공부하는 친구가 많습니다."
dec.teen.exam.grind: "모든 것을 걸고 공부한다"
dec.teen.exam.grind.hint: "지식이 크게 오르지만 몸과 마음이 지칩니다"
dec.teen.exam.balance: "할 만큼만 한다"
dec.teen.exam.grind.ok: "당신은 잠을 줄이고 책상 앞을 지켰습니다."
dec.teen.exam.balance.ok: "당신은 공부와 쉼 사이에서 균형을 지키려 했습니다."
dec.teen.job.title: "첫 아르바이트"
dec.teen.job.body: "동네 가게에서 방과 후에 일할 사람을 찾는다고 합니다."
dec.teen.job.take: "일해 본다"
dec.teen.job.study: "공부에 집중한다"
dec.teen.job.take.ok: "당신은 처음으로 스스로 번 돈을 손에 쥐었습니다."
dec.teen.job.study.ok: "당신은 지금은 공부할 때라고 생각했습니다."
dec.teen.drop.title: "학교와 생계 사이"
dec.teen.drop.body: "집안 형편이 어려워졌습니다. 당신이 일을 하면 가족에게 큰 도움이 됩니다."
dec.teen.drop.leave: "학교를 그만두고 일한다"
dec.teen.drop.stay: "어떻게든 학교를 마친다"
dec.teen.drop.leave.ok: "당신은 교복을 벗고 일자리를 찾아 나섰습니다."
dec.teen.drop.stay.ok: "당신은 버티며 학교를 계속 다녔습니다."
ev.teen.team: "당신은 학교 대표로 뽑혀 경기에 나갔습니다."
ev.teen.stage: "당신은 처음으로 사람들 앞에서 무대에 섰습니다."
dec.teen.mood.title: "가라앉는 마음"
dec.teen.mood.body: "요즘 마음이 자주 가라앉습니다. 아무것도 하고 싶지 않은 날이 늘었습니다."
dec.teen.mood.talk: "믿을 만한 사람에게 털어놓는다"
dec.teen.mood.talk.hint: "혼자 견디기 어려울 때는 주변이나 상담 기관에 도움을 청할 수 있습니다"
dec.teen.mood.alone: "혼자 견딘다"
dec.teen.mood.talk.ok: "이야기를 들어 준 사람 덕분에 당신은 조금씩 숨을 돌렸습니다."
dec.teen.mood.alone.ok: "당신은 아무에게도 말하지 않고 그 시간을 지나왔습니다."
ev.teen.phone: "당신에게 처음으로 휴대전화가 생겼습니다."
