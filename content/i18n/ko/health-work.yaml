ev.health.back: "허리가 아파 오래 서 있기 힘들어졌습니다."
dec.mid.title: "무거운 날들"
dec.mid.body: "몇 달째 잠을 설치고 무엇에도 마음이 가지 않습니다."
dec.mid.help: "도움을 청한다"
dec.mid.help.hint: "의료비 본인부담이 큰 나라일수록 비용이 듭니다. 상담 기관이나 가까운 사람에게 이야기할 수 있습니다"
dec.mid.endure: "혼자 버틴다"
dec.mid.help.ok: "당신은 이야기를 들어 줄 사람을 찾았습니다. 조금씩 잠이 돌아왔습니다."
dec.mid.endure.ok: "당신은 아무에게도 말하지 않았습니다. 긴 계절이 지나갔습니다."
ev.health.heart: "가슴을 쥐어짜는 통증에 당신은 병원으로 실려 갔습니다. 고비는 넘겼습니다."
ev.health.stroke: "당신은 뇌졸중으로 쓰러졌습니다. 한쪽 손이 예전처럼 움직이지 않습니다."
dec.cancer.title: "검사 결과"
dec.cancer.body: "의사가 조심스럽게 말을 꺼냈습니다. 암이라고 합니다."
dec.cancer.treat: "치료를 받는다"
dec.cancer.treat.hint: "이 나라의 의료 수준과 본인부담에 따라 결과와 비용이 달라집니다"
dec.cancer.none: "치료를 받지 않는다"
dec.cancer.treat.ok: "긴 치료 끝에 당신은 다시 일상으로 돌아왔습니다."
dec.cancer.treat.fail: "치료를 받았지만 병은 물러서지 않았습니다."
dec.cancer.none.ok: "당신은 남은 시간을 병원 밖에서 보내기로 했습니다."
ev.health.fall: "당신은 집 안에서 넘어져 뼈를 다쳤습니다. 회복이 더뎠습니다."
ev.health.memory: "당신은 자주 길을 잃고 가까운 이름을 떠올리지 못하게 되었습니다. 치매 진단을 받았습니다."
ev.health.hearing: "귀가 어두워져 사람들의 말을 자꾸 되묻게 되었습니다."
ev.old.hobby: "당신은 일에서 물러난 뒤 오래 미뤄 둔 취미를 시작했습니다."
ev.old.learn: "당신은 늦은 나이에 새로운 것을 배우기 시작했습니다."
ev.old.friends_gone: "오래 알던 친구가 또 한 사람 세상을 떠났습니다."
ev.old.live_with_children: "당신은 자식의 집으로 옮겨 함께 살게 되었습니다."
ev.old.great_grandchild: "당신은 증손주를 품에 안았습니다."
dec.lonely.title: "조용한 집"
dec.lonely.body: "하루 종일 아무와도 말하지 않는 날이 늘었습니다."
dec.lonely.out: "동네 모임에 나가 본다"
dec.lonely.home: "집에 있는다"
dec.lonely.out.ok: "모임에서 당신은 오랜만에 소리 내어 웃었습니다."
dec.lonely.home.ok: "당신은 창밖을 보며 하루를 보냈습니다."
ev.job.harvest_good: "올해는 농사가 잘되었습니다. 곳간이 넉넉해졌습니다."
ev.job.harvest_bad: "올해 농사는 망쳤습니다. 빚을 내야 할지 고민입니다."
dec.overtime.title: "잔업"
dec.overtime.body: "주문이 밀려 공장에서 잔업할 사람을 찾습니다."
dec.overtime.yes: "잔업한다"
dec.overtime.no: "정시에 퇴근한다"
dec.overtime.yes.ok: "당신은 늦게까지 일하고 수당을 받았습니다."
dec.overtime.no.ok: "당신은 저녁을 가족과 함께 보냈습니다."
ev.job.teacher_thanks: "오래전 가르친 학생이 찾아와 고맙다고 인사했습니다."
ev.job.care_night: "밤샘 근무가 이어진 한 해였습니다. 몸이 무거웠습니다."
ev.job.doctor_loss: "당신이 끝까지 지키려 했던 사람을 떠나보냈습니다. 그 얼굴이 오래 남았습니다."
dec.startup.title: "새 회사의 제안"
dec.startup.body: "막 시작한 작은 회사에서 함께하자고 합니다. 잘되면 큰 기회지만 불안정합니다."
dec.startup.join: "합류한다"
dec.startup.join.hint: "성공하면 소득이 크게 오르고, 실패하면 일을 잃습니다"
dec.startup.stay: "지금 회사에 남는다"
dec.startup.ok: "회사가 빠르게 자랐습니다. 당신의 몫도 함께 커졌습니다."
dec.startup.fail: "회사는 문을 닫았습니다. 당신은 다시 일자리를 찾아야 했습니다."
dec.startup.stay.ok: "당신은 지금의 자리를 지키기로 했습니다."
ev.job.road_scare: "아찔한 순간이 있었습니다. 브레이크를 밟은 발이 한참 떨렸습니다."
ev.job.mine_collapse: "갱도 일부가 무너졌습니다. 당신은 구조되었지만 함께 일하던 사람들을 잃었습니다."
dec.rival.title: "길 건너 새 가게"
dec.rival.body: "근처에 비슷한 가게가 새로 문을 열었습니다. 손님이 줄고 있습니다."
dec.rival.invest: "가게를 손본다"
dec.rival.wait: "버티며 지켜본다"
dec.rival.invest.ok: "가게를 새로 꾸미자 손님이 다시 늘었습니다."
dec.rival.invest.fail: "돈을 들였지만 손님은 돌아오지 않았습니다."
dec.rival.wait.ok: "당신은 줄어든 손님을 바라보며 하루하루를 버텼습니다."
ev.mig.homesick: "고향 음식 냄새가 그리운 밤이 잦았습니다."
ev.mig.language: "당신은 이제 이곳의 말로 농담도 할 수 있게 되었습니다."
ev.mig.discrimination: "당신은 출신 때문에 무시당하는 일을 겪었습니다."
ev.mig.remittance: "당신은 번 돈의 일부를 고향의 부모님께 보냈습니다."
ev.mig.citizenship: "당신은 이 나라의 시민권을 얻었습니다."
ev.mig.camp_school: "피란지의 임시 학교에서 당신은 다시 공부를 시작했습니다."
